<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SpaceStation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Rye&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Direction: Nothing-style instrument. Monochrome graphite + one signal colour (deep teal); fire follows the theme.
   Layout: a 24×24 design board the size of the screen. Every block (brand, theme, clock, recent, camp, search, modules, table) sits on the grid and can be moved/resized in Arrange mode. */
:root{
  --bg:#0B0C0C; --card:#131515; --card-hi:#181B1B; --fg:#ECEEED; --muted:#858C8A; --line:#232727; --dot-off:#262B2A; --plate:#ECEEED;
  --signal:#3DB5A6; --signal-soft:rgba(61,181,166,.14); --danger:#E0605A; --scrim:rgba(0,0,0,.6);
  --fire:#4FD1C5; --fire-core:#D6FFF8; --grid:rgba(61,181,166,.14);
  --t3-skin:#2E3534; --t3-shirt:#232A29; --t3-wood:#1F2625; --t3-ink:#CDD4D1; --t3-metal:#7D8986; --t3-chair:#262E2D;
  --dots:"Doto","DotGothic16",ui-monospace,monospace;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EFF0EE; --card:#FAFAF9; --card-hi:#FFFFFF; --fg:#111312; --muted:#6B7270; --line:#DCDEDB; --dot-off:#DADDDA; --plate:#FFFFFF;
  --signal:#1C7F75; --signal-soft:rgba(28,127,117,.10); --danger:#C2413B; --scrim:rgba(20,22,21,.35);
  --fire:#F0A23A; --fire-core:#FFF0C4; --grid:rgba(28,127,117,.12);
  --t3-skin:#F4F3EF; --t3-shirt:#DFE2DE; --t3-wood:#E9E6DF; --t3-ink:#1B1E1D; --t3-metal:#8E9794; --t3-chair:#D6D4CD; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EFF0EE; --card:#FAFAF9; --card-hi:#FFFFFF; --fg:#111312; --muted:#6B7270; --line:#DCDEDB; --dot-off:#DADDDA; --plate:#FFFFFF;
  --signal:#1C7F75; --signal-soft:rgba(28,127,117,.10); --danger:#C2413B; --scrim:rgba(20,22,21,.35);
  --fire:#F0A23A; --fire-core:#FFF0C4; --grid:rgba(28,127,117,.12);
  --t3-skin:#F4F3EF; --t3-shirt:#DFE2DE; --t3-wood:#E9E6DF; --t3-ink:#1B1E1D; --t3-metal:#8E9794; --t3-chair:#D6D4CD; color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{position:relative;background:radial-gradient(var(--dot-off) 1px,transparent 1.2px) 0 0/34px 34px,var(--bg);color:var(--fg);
  font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card,.module,.site,.rec,.search input{transition:background-color .35s,border-color .35s,color .35s}
/* a dot on the background grid now and then catches the light, like a far star */
.glint{position:absolute;z-index:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;pointer-events:none;opacity:0;animation:glint var(--d,1.8s) ease-in-out forwards}
.glint::before,.glint::after{content:"";position:absolute;inset:0;background:var(--fg);clip-path:polygon(50% 0,56% 44%,100% 50%,56% 56%,50% 100%,44% 56%,0 50%,44% 44%)}
.glint::after{inset:5px;border-radius:50%;clip-path:none;box-shadow:0 0 8px 2px color-mix(in srgb,var(--fg) 45%,transparent)}
@keyframes glint{0%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:var(--o,.5);transform:scale(1) rotate(20deg)}100%{opacity:0;transform:scale(.3) rotate(45deg)}}

/* ---------- board ---------- */
.board{position:relative;z-index:1;width:100%;margin:0;display:grid;
  grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(24,minmax(0,1fr));
  height:max(700px,calc(100vh - 32px))}
.blk{grid-column:var(--gx)/span var(--gw);grid-row:var(--gy)/span var(--gh);min-width:0;min-height:0;position:relative;padding:6px 8px;container-type:size}
.b-view,.b-recent{overflow:auto;scrollbar-width:thin}
@media (max-width:899px){
  .board{display:flex;flex-direction:column;gap:18px;height:auto}
  .blk{container-type:inline-size;padding:0}
  .b-view,.b-recent{overflow:visible}
  .b-camp{height:320px}.b-table{height:400px}
  .b-theme{order:0;position:absolute;top:0;right:0;z-index:2}.b-brand{order:1;padding-right:58px}.b-clock{order:2}.b-search{order:3}.b-view{order:4}.b-recent{order:5}.b-table{order:6}.b-camp{order:7}
}

/* arrange mode */
.board.arranging{background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:calc(100% / 24) calc(100% / 24);outline:1px solid var(--grid)}
.board.arranging .blk{cursor:grab;outline:1.5px dashed color-mix(in srgb,var(--signal) 60%,transparent);outline-offset:-2px;border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,transparent);touch-action:none}
.board.arranging .blk > *:not(.rz):not(.bname){pointer-events:none}
.board.arranging .blk.moving{cursor:grabbing;z-index:5;outline-style:solid;box-shadow:0 18px 40px -20px rgba(0,0,0,.5)}
.rz,.bname{display:none}
.board.arranging .rz{display:block;position:absolute;right:2px;bottom:2px;width:18px;height:18px;cursor:nwse-resize;z-index:6;
  background:linear-gradient(135deg,transparent 50%,var(--signal) 50%);border-radius:0 0 10px 0}
.board.arranging .bname{display:block;position:absolute;left:8px;top:6px;z-index:6;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--signal);color:var(--bg);padding:2px 8px;border-radius:999px;pointer-events:none}
.arrangebar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:10px;
  padding:8px 8px 8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.5);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* ---------- headline + theme ---------- */
.b-brand{display:flex;align-items:center;justify-content:center}
.b-theme{display:flex;align-items:flex-start;justify-content:flex-end}
.brand{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:4px 16px;text-align:center;line-height:1.05}
.brand .hello{font-family:var(--mono);font-size:clamp(11px,1.8cqw,14px);font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .hello b{color:var(--fg);font-weight:500}
.brand .name{font-family:var(--dots);font-weight:800;font-size:clamp(28px,6cqw,46px);letter-spacing:.14em;display:inline-flex;align-items:center;gap:12px;white-space:nowrap}
.brand .name::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px var(--signal)}
.themer{all:unset;cursor:pointer;width:50px;aspect-ratio:1;border-radius:50%;display:block;flex:none}
.themer:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.themer svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .8s cubic-bezier(.65,0,.25,1)}
.themer.turn svg{transform:rotate(360deg)}
.tg-bg{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tg-q{fill:var(--signal-soft)}
.tg-bar{fill:var(--muted);transition:transform .6s cubic-bezier(.65,0,.25,1)}
.tg-body{fill:var(--fire);transition:fill .6s}
.tg-shade{fill:var(--card);transition:transform .7s cubic-bezier(.65,0,.25,1),fill .35s;transform:translate(24px,-22px)}
.tg-rays{transform-box:fill-box;transform-origin:center;transition:transform .7s cubic-bezier(.65,0,.25,1),opacity .4s}
.tg-rays rect{fill:var(--fire);transition:fill .6s}
.tg-stars{opacity:0;transition:opacity .5s .2s}
.tg-stars rect{fill:var(--fg)}
.themer.moon .tg-body{fill:var(--fg)}
.themer.moon .tg-shade{transform:translate(6px,-5px)}
.themer.moon .tg-rays{transform:rotate(90deg) scale(0);opacity:0}
.themer.moon .tg-stars{opacity:1}
.themer.moon .tg-bar{transform:translateX(-22px)}
.themer:hover .tg-rays{transform:rotate(22deg)}

/* ---------- clock + weather ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px}
.b-clock{display:flex}
.clockcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px 14px;overflow:hidden}
.ck-head{width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.ck-head .date b{color:var(--fg);font-weight:500}
.dialwrap{flex:1 1 auto;min-height:120px;width:100%;display:grid;place-items:center}
.dial{height:100%;max-height:240px;max-width:100%;aspect-ratio:1;display:block}
.dial .face{fill:var(--bg)}
.dial .rim{fill:none;stroke:var(--line);stroke-width:1}
.dial .sec-track{fill:none;stroke:var(--dot-off);stroke-width:1.4}
.dial .sec-arc{fill:none;stroke:var(--signal);stroke-width:1.4;stroke-linecap:round;transition:stroke-dashoffset .3s}
.dial .tick{stroke:var(--muted);stroke-width:.5}
.dial .tick.q{stroke:var(--fg);stroke-width:1.4}
.dial .num{font-family:var(--dots);font-weight:800;font-size:8.5px;fill:var(--fg)}
.dial .h,.dial .m{stroke:var(--fg);stroke-linecap:round}
.dial .s{stroke:var(--signal);stroke-linecap:round}
.dial .hub{fill:var(--signal)}
.dial .hub2{fill:var(--bg)}
.dw .sunb{fill:var(--fire);opacity:.32}
.dw .sunr{fill:var(--fire);opacity:.28}
.dw .moon{fill:var(--fg);opacity:.22}
.dw .star{fill:var(--fg);opacity:.35}
.dw .cl{fill:var(--muted);opacity:.2}
.dw .cl2{fill:var(--fg);opacity:.1}
.dw .drop{fill:var(--signal);opacity:.45}
.dw .flake{fill:var(--fg);opacity:.4}
.dw .bolt{fill:var(--fire);opacity:.6}
.dw .fogb{fill:var(--muted);opacity:.16}
.dw-spin{transform-origin:var(--ox) var(--oy);animation:wspin 40s linear infinite}
.dw-pulse{animation:dwpulse 5s ease-in-out infinite}
.dw-drift{animation:dwdrift 34s linear infinite}
.dw-drift.s2{animation-duration:52s;animation-delay:-20s}
.dw-drift.s3{animation-duration:44s;animation-delay:-34s}
.dw-rain{animation:dwrain .9s linear infinite}
.dw-snow{animation:dwrain 3.2s linear infinite}
@keyframes dwpulse{50%{opacity:.18}}
@keyframes dwdrift{from{transform:translateX(-62px)}to{transform:translateX(104px)}}
@keyframes dwrain{from{transform:translateY(-10px)}to{transform:translateY(14px)}}
.digital{display:flex;align-items:baseline;justify-content:center}
.time{font-family:var(--dots);font-weight:800;font-size:clamp(30px,11cqw,42px);line-height:.9;letter-spacing:.03em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline}
.time .colon{animation:blink 1s steps(1) infinite;margin:0 1px}
.time .sec{font-size:.44em;color:var(--signal);margin-left:6px}
@keyframes blink{50%{opacity:.15}}
.date{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ck-wx{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 10px;text-align:center}
.ck-temp{font-family:var(--dots);font-weight:800;font-size:24px;line-height:1}
.ck-cond{font-size:14px;font-weight:500}
.ck-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ck-days{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding-top:10px;border-top:1px dashed var(--line)}
.ck-day{display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ck-day .dn{letter-spacing:.1em;text-transform:uppercase}
.ck-day.today .dn{color:var(--signal)}
.ck-day svg{width:24px;height:24px;overflow:visible;margin:2px 0}
.ck-day b{color:var(--fg);font-weight:500;font-size:12px}
.ck-foot{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.8;text-align:center}
@container (max-height:470px){.ck-foot{display:none}}
@container (max-height:400px){.ck-days{display:none}}
@media (max-width:899px){.clockcard{flex:none;width:100%}.dialwrap{flex:none;height:min(64vw,240px)}}
.wx{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;padding-top:10px;border-top:1px dashed var(--line)}
.wx-icon{width:44px;height:44px;flex:none;overflow:visible}
.wx-temp{font-family:var(--dots);font-weight:800;font-size:32px;line-height:1}
.wx-meta{display:flex;flex-direction:column;align-items:flex-start;gap:1px;font-size:13px}
.wx-meta span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;display:inline-flex;align-items:center;gap:4px}
.wx-as{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:-6px}
.wx-icon .w-ink{fill:var(--fg)} .wx-icon .w-sig{fill:var(--signal)} .wx-icon .w-muted{fill:var(--muted)} .wx-icon .w-fire{fill:var(--fire)}
.w-spin{transform-box:fill-box;transform-origin:center;animation:wspin 14s linear infinite}
.w-drift{animation:wdrift 5s ease-in-out infinite alternate}
.w-drift2{animation:wdrift 7s ease-in-out infinite alternate-reverse}
.w-fall{animation:wfall 1.1s steps(4) infinite}
.w-fall.d2{animation-delay:-.35s}.w-fall.d3{animation-delay:-.7s}
.w-snow{animation:wfall 2.6s steps(6) infinite}
.w-flash{animation:wflash 3s steps(1) infinite}
.w-twinkle{animation:wtw 2.4s steps(2) infinite}
.w-slide{animation:wdrift 3s ease-in-out infinite alternate}
@keyframes wspin{to{transform:rotate(360deg)}}
@keyframes wdrift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes wfall{from{transform:translateY(-4px);opacity:0}30%{opacity:1}to{transform:translateY(8px);opacity:0}}
@keyframes wflash{0%,82%,90%{opacity:0}85%,94%{opacity:1}}
@keyframes wtw{50%{opacity:.2}}

/* ---------- search ---------- */
.b-search{display:flex;align-items:center}
.search{position:relative;width:100%}
.search input{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:13px 46px;outline:none;text-align:center;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--signal);box-shadow:0 0 0 4px var(--signal-soft)}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* ---------- recent ---------- */
.b-recent{display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center}
.recents{display:flex;flex-direction:column;gap:6px}
.rec{display:flex;align-items:center;gap:12px;padding:7px 12px 7px 7px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;min-width:0}
.rec:hover{border-color:color-mix(in srgb,var(--signal) 55%,var(--line));background:var(--card-hi)}
.rec:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.rec .fav{width:30px;height:30px;border-radius:9px}
.rec .fav img{width:18px;height:18px}
.rec .fav.mono{font-size:16px}
.rec .r-name{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .r-time{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rec-empty{font-size:13px;color:var(--muted);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:14px}

/* ---------- glyphs + modules + rooms ---------- */
.glyph{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:54px;height:54px}
.glyph.sm{width:28px;height:28px;gap:1.5px}
.glyph i{border-radius:50%;background:var(--dot-off);transition:background .25s,box-shadow .25s}
.glyph i.on{background:var(--signal);box-shadow:0 0 6px color-mix(in srgb,var(--signal) 55%,transparent)}
.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%}
@container (max-width:560px){.modules{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:340px){.modules{grid-template-columns:1fr}}
.module{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px 14px 18px;
  border-radius:22px;background:var(--card);border:1px solid var(--line);position:relative;text-align:center;min-height:170px;
  transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,background-color .25s}
.module:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--signal) 55%,var(--line));background:var(--card-hi)}
.module:hover .glyph i.on{box-shadow:0 0 10px var(--signal)}
.module:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
.m-name{font-weight:500;font-size:19px;letter-spacing:-.01em;line-height:1.2;max-width:100%;overflow-wrap:anywhere}
.m-desc{font-size:13px;color:var(--muted);line-height:1.4;max-width:24ch}
.m-count{position:absolute;top:14px;right:16px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.room{display:flex;flex-direction:column;gap:16px;width:100%}
.room-head{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;min-height:44px}
.room-head h2{font-family:var(--dots);font-weight:800;font-size:30px;letter-spacing:.06em;line-height:1;margin:0;overflow-wrap:anywhere}
.room-head .cnt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.back{all:unset;cursor:pointer;position:absolute;left:0;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:7px 14px 7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);transition:color .2s,border-color .2s}
.back:hover{color:var(--fg);border-color:var(--signal)}
.back:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@container (max-width:520px){.room-head{flex-wrap:wrap;padding-top:44px}.back{top:0;transform:none}}
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
@container (max-width:560px){.sites{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:300px){.sites{grid-template-columns:1fr}}
.site{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px 14px;border-radius:18px;text-decoration:none;color:var(--fg);min-width:0;text-align:center;
  background:var(--card);border:1px solid var(--line);transition:transform .2s,border-color .2s,background-color .2s}
.site:hover,.site.first{border-color:color-mix(in srgb,var(--signal) 55%,var(--line));background:var(--card-hi);transform:translateY(-2px)}
.site:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.fav{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--plate);border:1px solid var(--line);overflow:hidden;flex:none}
.fav img{width:26px;height:26px;display:block}
.fav.mono{background:var(--signal-soft);border-color:color-mix(in srgb,var(--signal) 30%,transparent);color:var(--signal);font-family:var(--dots);font-weight:800;font-size:22px}
.fav.gl{background:var(--card-hi);border-color:var(--line)}
.site b{font-weight:500;font-size:15px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site small{font-family:var(--mono);font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-5px}
.site .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.sdot{position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--signal);opacity:.75}
.sdot.down{background:var(--danger);opacity:.9;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.results-label{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.empty{color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;text-align:center}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;opacity:.7;margin:12px 0 0}
.status{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--muted)}
.status.err{color:var(--danger);border-color:var(--danger)}

/* ---------- pixel scenes ---------- */
.cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.b-camp,.b-table{display:flex;flex-direction:column;gap:6px}
.pxwrap{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;user-select:none;-webkit-user-select:none}
.pxwrap canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* the scene melts into the page at its edges instead of sitting in a hard frame */
#camp{-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 10%,#000 88%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(to bottom,transparent,#000 10%,#000 88%,transparent);mask-composite:intersect}
#rt{cursor:pointer;outline:none;image-rendering:auto}
#rt.busy{cursor:default}
#rt:focus-visible{outline:2px solid var(--signal);outline-offset:4px;border-radius:8px}
.rt-name{position:absolute;left:0;top:0;font-family:"Rye",Georgia,serif;font-size:11px;line-height:1;letter-spacing:.04em;color:var(--fg);white-space:nowrap;pointer-events:none;
  background:color-mix(in srgb,var(--card) 86%,transparent);border:1px solid var(--line);padding:4px 9px 3px;border-radius:999px;transition:color .3s,background-color .3s,opacity .3s}
.rt-bang .rt-name{opacity:0}
.rt-name.out{color:var(--danger);text-decoration:line-through;opacity:.75}
.rt-name.win{color:#2b1f12;background:#e6b843;border-color:#b48a2a}
.rt-name.win::before{content:"★ "}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- menus + editor ---------- */
.menu{position:fixed;z-index:40;min-width:200px;padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 50px -18px rgba(0,0,0,.55);display:flex;flex-direction:column;text-align:left}
.menu .mh{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:6px 10px 4px}
.menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--fg)}
.menu button:hover,.menu button:focus-visible{background:var(--signal-soft)}
.menu button:disabled{opacity:.35;cursor:default;background:none}
.menu button.danger{color:var(--danger)}
.menu button.danger.armed{background:var(--danger);color:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.menu svg{flex:none;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(4px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,430px);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;text-align:left;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.panel h3{margin:0;font-family:var(--dots);font-weight:800;font-size:24px;letter-spacing:.06em;text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > .fl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
.field input:focus,.field select:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.glyphs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.gopt{all:unset;cursor:pointer;display:grid;place-items:center;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);max-width:100%;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gopt[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft);color:var(--signal)}
.gopt:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.gopt .glyph{width:26px;height:26px;gap:1.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--fg);background:var(--bg);text-align:center;font-family:var(--body);letter-spacing:0;text-transform:none}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--bg);font-weight:500}
.formerr{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 0}

/* ---------- glass: cards are frosted panes over the starfield grid ---------- */
.card,.module,.site,.rec,.rec-empty,.search input,.tg-glass{
  background:linear-gradient(160deg,color-mix(in srgb,var(--card-hi) 62%,transparent),color-mix(in srgb,var(--card) 34%,transparent));
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  border-color:color-mix(in srgb,var(--fg) 11%,transparent);
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 9%,transparent),inset 0 -1px 0 color-mix(in srgb,#000 12%,transparent),0 14px 34px -22px rgba(0,0,0,.55)}
.module:hover,.site:hover,.site.first,.rec:hover{background:linear-gradient(160deg,color-mix(in srgb,var(--card-hi) 82%,transparent),color-mix(in srgb,var(--card) 55%,transparent))}
.themer{border-radius:50%;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tg-bg{fill:color-mix(in srgb,var(--card) 55%,transparent)}
/* recently opened reads right-to-left when it lives on the right side of the board */
@media (min-width:900px){
  .b-recent.mirror .label{text-align:right}
  .b-recent.mirror .rec{flex-direction:row-reverse;padding:7px 7px 7px 12px;text-align:right}
  .b-recent.mirror .rec-empty{text-align:right}
}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){animation:reveal .75s cubic-bezier(.65,0,.25,1)}
@keyframes reveal{from{clip-path:circle(0px at var(--vx,100%) var(--vy,0%))}to{clip-path:circle(150vmax at var(--vx,100%) var(--vy,0%))}}
.enter > *{animation:rise-in .4s cubic-bezier(.2,.7,.2,1) both}
.enter > *:nth-child(2){animation-delay:.03s}.enter > *:nth-child(3){animation-delay:.06s}.enter > *:nth-child(4){animation-delay:.09s}
.enter > *:nth-child(5){animation-delay:.12s}.enter > *:nth-child(6){animation-delay:.15s}.enter > *:nth-child(n+7){animation-delay:.18s}
@keyframes rise-in{from{transform:translateY(8px);opacity:.001}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*,::view-transition-new(root){animation:none!important;transition:none!important}}
</style>

<script>
let FAV={};try{FAV=JSON.parse(localStorage.getItem('ss-fav')||'{}')||{}}catch{}
const GLYPHS={
  watch:["#########","#.......#","#..#....#","#..##...#","#..###..#","#..##...#","#..#....#","#########","..#####.."],
  subs:["#########","#.......#","#.##.##.#","#.......#","#.###.#.#","#.......#","#########",".#.......","#........"],
  games:[".........",".#######.","##.##.#.#","#...#####","##.##.#.#","#########","###...###","##.....##","........."],
  software:["....#....","....#....","....#....","..#.#.#..","...###...","....#....",".........","#.......#","#########"],
  work:[".........","...###...","...#.#...","#########","#.......#","####.####","#.......#","#########","........."],
  print:["....#....","..##.##..","##.....##","#.##.##.#","#...#...#","#...#...#","#...#...#",".##.#.##.","...###..."],
  star:["....#....","...###...","#########",".#######.","..#####..","..##.##..",".##...##.","##.....##","........."],
  music:["...######","...#....#","...######","...#....#","...#....#","...#..###",".###..###",".###.....","........."],
  book:[".........","#########","#...#...#","#.#.#.#.#","#...#...#","#.#.#.#.#","#...#...#","#########","........."],
  globe:["..#####..",".#..#..#.","#..#.#..#","#########","#..#.#..#","#########","#..#.#..#",".#..#..#.","..#####.."],
  chat:[".........","#########","#.......#","#.#.#.#.#","#.......#","#########","..##.....",".#.......","........."],
  folder:[".........","###......","#..#.....","#########","#.......#","#.......#","#.......#","#########","........."]
};
const $=id=>document.getElementById(id);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const glyph=(g,cls='')=>`<span class="glyph ${cls}" aria-hidden="true">${(GLYPHS[g]||GLYPHS.star).join('').split('').map(c=>c==='#'?'<i class="on"></i>':'<i></i>').join('')}</span>`;
const fav=it=>{
  if(it.glyph&&GLYPHS[it.glyph])return `<span class="fav gl">${glyph(it.glyph,'sm')}</span>`;
  const h=host(it.url),src=FAV[h],letter=esc((it.name||'?')[0]);if(src)return`<span class="fav"><img src="${src}" alt="" loading="lazy"></span>`;
  return /^https?:/i.test(it.url||'')?`<span class="fav"><img src="https://icons.duckduckgo.com/ip3/${esc(h)}.ico" alt="" loading="lazy" onerror="this.parentNode.className='fav mono';this.parentNode.textContent='${letter}'"></span>`:`<span class="fav mono">${letter}</span>`};
const newId=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ago=t=>{const s=(Date.now()-new Date(t))/1000;if(!(s>=0))return'';if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
const desktop=()=>matchMedia('(min-width:900px)').matches;

let modules=null,recent=[],siteStatus=null,weather=null,forecast=null;
let db=null,canWrite=false,loadFailed=false,layoutRef=null,recentRef=null,uiRef=null;

/* ======================= board layout ======================= */
const BLOCKS={theme:'Theme',brand:'Headline',clock:'Clock',recent:'Recent',camp:'Site of Grace',search:'Search',view:'Modules',table:'Roundtable'};
const DEF={clock:{x:0,y:0,w:5,h:11},table:{x:0,y:15,w:5,h:9},brand:{x:8,y:0,w:8,h:3},search:{x:7,y:3,w:10,h:2},view:{x:6,y:5,w:12,h:19},
  theme:{x:22,y:0,w:2,h:2},recent:{x:20,y:2,w:4,h:12},camp:{x:20,y:14,w:4,h:10}};
let UI=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem('ss-ui4')||'null');if(s&&typeof s==='object')for(const k in DEF)if(s[k])UI[k]=sanitize(s[k],DEF[k])}catch{}
function sanitize(p,d){const w=clamp(+p.w||d.w,2,24),h=clamp(+p.h||d.h,2,24);return{w,h,x:clamp(+p.x||0,0,24-w),y:clamp(+p.y||0,0,24-h)}}
const board=$('board');
function place(id){const el=board.querySelector(`[data-b="${id}"]`),p=UI[id];el.classList.toggle('mirror',p.x+p.w/2>12);el.style.setProperty('--gx',p.x+1);el.style.setProperty('--gy',p.y+1);el.style.setProperty('--gw',p.w);el.style.setProperty('--gh',p.h)}
function placeAll(){for(const k in UI)place(k)}
placeAll();
board.querySelectorAll('.blk').forEach(el=>el.insertAdjacentHTML('beforeend',`<span class="bname">${BLOCKS[el.dataset.b]}</span><span class="rz" aria-hidden="true"></span>`));
let arranging=false,uiTimer=null;
function setArrange(on){arranging=on&&desktop();board.classList.toggle('arranging',arranging);$('arrangebar').hidden=!arranging}
function saveUI(){
  try{localStorage.setItem('ss-ui4',JSON.stringify(UI))}catch{}
  clearTimeout(uiTimer);uiTimer=setTimeout(async()=>{if(uiRef&&canWrite){try{await uiRef.set({desktop4:JSON.parse(JSON.stringify(UI))})}catch{}}},600);
}
board.addEventListener('pointerdown',e=>{
  if(!arranging||e.button!==0)return;
  const blk=e.target.closest('.blk');if(!blk)return;
  e.preventDefault();
  const id=blk.dataset.b,r=board.getBoundingClientRect(),cw=r.width/24,ch=r.height/24,start={...UI[id]},sx=e.clientX,sy=e.clientY,resize=e.target.classList.contains('rz');
  blk.setPointerCapture(e.pointerId);blk.classList.add('moving');
  const mv=ev=>{const dx=Math.round((ev.clientX-sx)/cw),dy=Math.round((ev.clientY-sy)/ch);
    if(resize){UI[id].w=clamp(start.w+dx,2,24-start.x);UI[id].h=clamp(start.h+dy,2,24-start.y)}
    else{UI[id].x=clamp(start.x+dx,0,24-start.w);UI[id].y=clamp(start.y+dy,0,24-start.h)}
    place(id)};
  const up=()=>{blk.removeEventListener('pointermove',mv);blk.removeEventListener('pointerup',up);blk.removeEventListener('pointercancel',up);blk.classList.remove('moving');saveUI()};
  blk.addEventListener('pointermove',mv);blk.addEventListener('pointerup',up);blk.addEventListener('pointercancel',up);
});
board.addEventListener('click',e=>{if(arranging){e.preventDefault();e.stopPropagation()}},true);
$('ar-done').addEventListener('click',()=>setArrange(false));
$('ar-reset').addEventListener('click',()=>{UI=JSON.parse(JSON.stringify(DEF));placeAll();saveUI()});
addEventListener('resize',()=>{if(arranging&&!desktop())setArrange(false)});

/* ======================= theme ======================= */
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const effTheme=()=>root.dataset.theme||(mq.matches?'dark':'light');
const themeHooks=[];
function themeChanged(){$('themer').classList.toggle('moon',effTheme()==='dark');$('themer').setAttribute('aria-label',effTheme()==='dark'?'Switch to light theme':'Switch to dark theme');themeHooks.forEach(f=>f())}

/* ======================= star glints on the background grid ======================= */
(function glints(){
  const G=34,still=matchMedia('(prefers-reduced-motion: reduce)');
  function one(){
    if(!document.hidden&&!still.matches){const cols=Math.max(1,Math.floor(document.body.clientWidth/G)),x=(Math.floor(Math.random()*cols)+.5)*G,y=(Math.floor((scrollY+Math.random()*innerHeight)/G)+.5)*G;
      const e=document.createElement('i');e.className='glint';e.setAttribute('aria-hidden','true');e.style.left=x+'px';e.style.top=y+'px';
      e.style.setProperty('--d',(1.4+Math.random()*1.4).toFixed(2)+'s');e.style.setProperty('--o',(.22+Math.random()*.3).toFixed(2));
      e.addEventListener('animationend',()=>e.remove());document.body.appendChild(e)}
    setTimeout(one,700+Math.random()*2200)}
  setTimeout(one,1200);
})();

/* ======================= clock + weather ======================= */
const ticks=$('ticks');
for(let i=0;i<60;i++){const a=i*Math.PI/30,q=i%5===0,r1=q?39.5:42.6,r2=44.2;ticks.insertAdjacentHTML('beforeend',`<line class="tick${q?' q':''}" x1="${(50+r1*Math.sin(a)).toFixed(2)}" y1="${(50-r1*Math.cos(a)).toFixed(2)}" x2="${(50+r2*Math.sin(a)).toFixed(2)}" y2="${(50-r2*Math.cos(a)).toFixed(2)}"/>`)}
const ARC=2*Math.PI*48.6;$('secarc').style.strokeDasharray=ARC;
let firstName='';
const greeting=h=>h<5?'Late night':h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'Late night';
function paintGreet(){const g=greeting(new Date().getHours());$('greet').innerHTML=`${g}${firstName?`, <b>${esc(firstName)}</b>`:''} — welcome aboard`}
function tick(){
  const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();
  $('hh').setAttribute('transform',`rotate(${(h%12)*30+m*.5} 50 50)`);$('mh').setAttribute('transform',`rotate(${m*6+s*.1} 50 50)`);$('sh').setAttribute('transform',`rotate(${s*6} 50 50)`);
  $('secarc').style.strokeDashoffset=ARC*(1-s/60);
  $('hr').textContent=pad(h);$('mn').textContent=pad(m);$('sc').textContent=pad(s);
  $('date').innerHTML=`<b>${d.toLocaleDateString(undefined,{weekday:'short'})}</b> ${esc(d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}))}`;
  if(s===0){paintGreet();paintRecent();paintWeather()}
}
const CLOUD='M 10 30 C 4 30 3 22 9 21 C 9 14 18 12 21 17 C 24 11 35 12 35 20 C 41 20 42 30 36 30 Z';
function wxIcon(code,day){
  const sun=`<g class="w-spin">${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return`<circle class="w-fire" cx="${23+15*Math.cos(a)}" cy="${18+15*Math.sin(a)}" r="1.8"/>`}).join('')}</g><circle class="w-fire" cx="23" cy="18" r="8"/>`;
  const moon=`<path class="w-ink" d="M 26 6 A 12 12 0 1 0 36 24 A 10 10 0 1 1 26 6 Z"/><rect class="w-ink w-twinkle" x="38" y="6" width="2.5" height="2.5"/><rect class="w-ink w-twinkle" x="8" y="8" width="2" height="2" style="animation-delay:-1.2s"/>`;
  const cloud=(cls='w-muted',x=0,y=6)=>`<path class="${cls}" transform="translate(${x} ${y})" d="${CLOUD}"/>`;
  const drops=c=>[10,20,30].map((x,i)=>`<rect class="${c} w-fall d${i+1}" x="${x}" y="38" width="2" height="5" rx="1"/>`).join('');
  switch(code){
    case'clear':return day?sun:moon;
    case'partly':return`<g transform="translate(-6 -6) scale(.8)">${day?sun:moon}</g><g class="w-drift">${cloud('w-muted',4,8)}</g>`;
    case'cloudy':return`<g class="w-drift2">${cloud('w-muted',-6,0)}</g><g class="w-drift">${cloud('w-ink',4,8)}</g>`;
    case'rain':return`<g class="w-drift">${cloud('w-muted',0,0)}</g>${drops('w-sig')}`;
    case'storm':return`<g class="w-drift">${cloud('w-muted',0,0)}</g><path class="w-fire w-flash" d="M 22 32 L 16 42 L 21 42 L 18 50 L 28 38 L 23 38 L 26 32 Z"/>${drops('w-sig')}`;
    case'snow':return`<g class="w-drift">${cloud('w-muted',0,0)}</g>${[11,21,31].map((x,i)=>`<circle class="w-ink w-snow" cx="${x}" cy="40" r="1.8" style="animation-delay:${-i*.8}s"/>`).join('')}`;
    case'fog':return[12,20,28,36].map((y,i)=>`<rect class="${i%2?'w-ink':'w-muted'} w-slide" x="${4+(i%2)*4}" y="${y}" width="${34-(i%2)*6}" height="3" rx="1.5" style="animation-delay:${-i*.6}s"/>`).join('');
    default:return cloud();
  }
}
const WXNAME={clear:'Clear',partly:'Partly cloudy',cloudy:'Overcast',rain:'Rain',storm:'Thunderstorm',snow:'Snow',fog:'Fog'};
function dialWx(code,day){
  const sun=`<circle class="sunb dw-pulse" cx="31" cy="66" r="8.5"/><g class="dw-spin" style="--ox:31px;--oy:66px">${[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return`<circle class="sunr" cx="${(31+13.5*Math.cos(a)).toFixed(1)}" cy="${(66+13.5*Math.sin(a)).toFixed(1)}" r="1.3"/>`}).join('')}</g>`;
  const moon=`<path class="moon" d="M 68 55 A 9 9 0 1 0 77 67 A 7.2 7.2 0 1 1 68 55 Z"/>${[[24,30],[30,70],[72,30],[60,78],[20,52],[80,46]].map(([x,y],i)=>`<rect class="star w-twinkle" x="${x}" y="${y}" width="1.6" height="1.6" style="animation-delay:${-i*.5}s"/>`).join('')}`;
  const cloud=(x,y,s,cls='cl',sp='')=>`<g class="dw-drift ${sp}"><path class="${cls}" transform="translate(${x} ${y}) scale(${s})" d="${CLOUD}"/></g>`;
  const rain=`<g class="dw-rain">${[[30,64],[40,70],[50,62],[60,68],[70,64],[36,78],[56,80],[66,76]].map(([x,y])=>`<rect class="drop" x="${x}" y="${y}" width="1" height="4" rx=".5"/>`).join('')}</g>`;
  const snow=`<g class="dw-snow">${[[30,64],[42,72],[52,62],[62,70],[72,64],[38,80],[58,82]].map(([x,y])=>`<circle class="flake" cx="${x}" cy="${y}" r="1.2"/>`).join('')}</g>`;
  switch(code){
    case'clear':return day?sun:moon;
    case'partly':return(day?sun:moon)+cloud(16,52,1,'cl','s2');
    case'cloudy':return cloud(10,48,1.1,'cl')+cloud(30,60,.9,'cl2','s2')+cloud(4,62,.8,'cl','s3');
    case'rain':return cloud(14,46,1.1,'cl')+cloud(30,54,.9,'cl2','s2')+rain;
    case'storm':return cloud(14,46,1.1,'cl')+`<path class="bolt w-flash" d="M 52 62 L 46 72 L 51 72 L 48 80 L 58 68 L 53 68 L 56 62 Z"/>`+rain;
    case'snow':return cloud(14,48,1.1,'cl')+snow;
    case'fog':return[58,64,70,76].map((y,i)=>`<rect class="fogb w-slide" x="${16+(i%2)*6}" y="${y}" width="${66-(i%2)*10}" height="3" rx="1.5" style="animation-delay:${-i*.6}s"/>`).join('');
    default:return cloud(14,50,1);
  }
}
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function currentWx(){
  const f=forecast,now=Date.now(),hours=(f&&Array.isArray(f.hourly)?f.hourly:[]).filter(h=>new Date(h.at).getTime()>now-90*6e4);
  if(weather&&weather.temp!=null&&weather.updatedAt&&now-new Date(weather.updatedAt)<3*36e5)return weather;
  if(hours[0])return{temp:hours[0].temp,code:hours[0].code,isDay:hours[0].day,city:f.city};
  return weather&&weather.temp!=null?weather:null;
}
let lastDial='';
function paintWeather(){
  const cur=currentWx(),f=forecast,today=dayKey(new Date());
  const days=(f&&Array.isArray(f.daily)?f.daily:[]).filter(d=>d.date>=today).slice(0,5);
  const dk=cur?cur.code+(cur.isDay!==false):'';if(dk!==lastDial){$('dialwx').innerHTML=cur?dialWx(cur.code,cur.isDay!==false):'';lastDial=dk}
  const t0=days[0]&&days[0].date===today?days[0]:null;
  const meta=[t0?`H ${Math.round(t0.hi)}° · L ${Math.round(t0.lo)}°`:'',cur&&cur.humidity!=null?`${Math.round(cur.humidity)}% humidity`:''].filter(Boolean).join(' · ');
  $('ckwx').innerHTML=cur?`<span class="ck-temp">${Math.round(cur.temp)}°</span><span class="ck-cond">${esc(WXNAME[cur.code]||'Weather')}</span>${meta?`<span class="ck-meta">${meta}</span>`:''}`:'';
  const ic=c=>`<svg class="wx-icon" viewBox="0 0 46 46" aria-hidden="true">${wxIcon(c,true)}</svg>`;
  $('ckdays').innerHTML=days.map(d=>`<div class="ck-day${d.date===today?' today':''}"><span class="dn">${d.date===today?'Today':esc(new Date(d.date+'T12:00').toLocaleDateString(undefined,{weekday:'short'}))}</span>${ic(d.code)}<b>${Math.round(d.hi)}°</b><span>${Math.round(d.lo)}°</span></div>`).join('');
  const city=(cur&&cur.city)||(f&&f.city)||'';
  $('ckfoot').textContent=[city,t0&&t0.sunrise?`Sunrise ${t0.sunrise}`:'',t0&&t0.sunset?`Sunset ${t0.sunset}`:''].filter(Boolean).join(' · ');
}

const $view=$('view'),$q=$('q');
function sdot(url){
  if(!siteStatus||!siteStatus.sites||Date.now()-new Date(siteStatus.checkedAt)>7*864e5)return'';
  const v=siteStatus.sites[url];if(v!=='up'&&v!=='down')return'';const when=ago(siteStatus.checkedAt);
  return`<span class="sdot ${v}" title="${v==='up'?'Responding':'Not responding'} · checked ${when==='now'?'just now':when+' ago'}"></span>`;
}
function siteCard(it,mod,showCat,mi,si){

}

    <button class="module" data-go="${esc(c.id)}" data-m="${i}" aria-label="Open ${esc(c.name)}"><span class="m-count">${pad(c.items.length)}</span>${glyph(c.glyph)}

function room(c,mi){

function results(q){
  const hits=[];modules.forEach((c,mi)=>c.items.forEach((it,si)=>{if((it.name+' '+host(it.url)+' '+c.name).toLowerCase().includes(q))hits.push([it,c,mi,si])}));
  $view.innerHTML=hits.length?`<div class="room"><div class="results-label">${hits.length} match${hits.length>1?'es':''} · Enter opens the first</div><div class="sites">${hits.map(([it,c,mi,si])=>siteCard(it,c,true,mi,si)).join('')}</div></div>`

const curRoom=()=>modules?modules.findIndex(c=>c.id===location.hash.slice(1)):-1;
function route(){

const go=id=>{if(id)location.hash=id;else history.pushState(null,'',location.pathname+location.search);route()};

/* ======================= saving ======================= */
let saving=false,saveAgain=false,statusTimer=null;
function toast(msg,err){const s=$('status');s.textContent=msg;s.classList.toggle('err',!!err);s.hidden=false;clearTimeout(statusTimer);statusTimer=setTimeout(()=>s.hidden=true,err?5000:1600)}
async function saveLayout(){
  if(!layoutRef)return;if(saving){saveAgain=true;return}
  saving=true;
  try{await layoutRef.set({modules:JSON.parse(JSON.stringify(modules))});toast('Saved')}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Remove a few sites, then try again.':"Couldn't save. Check your connection and try again.",true)}

}

function askName(){const n=prompt('Your first name for the greeting (leave empty for none):',firstName);if(n===null)return;firstName=n.trim().slice(0,30);store.set('ss-name',firstName);paintGreet()}
function exportBackup(){
  const b={app:'spacestation',version:1,exportedAt:new Date().toISOString(),name:firstName,modules,recent,ui:UI,fav:FAV};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(b)],{type:'application/json'}));a.download='spacestation-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function importBackup(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{try{const b=JSON.parse(await i.files[0].text());if(b.app!=='spacestation'||!Array.isArray(b.modules))throw 0;
    store.set('ss-modules',b.modules);store.set('ss-recent',Array.isArray(b.recent)?b.recent.slice(0,5):[]);if(b.fav)store.set('ss-fav',b.fav);
    if(b.ui)store.set('ss-ui4',b.ui);if(typeof b.name==='string')store.set('ss-name',b.name);location.reload()}catch{toast("That file isn't a SpaceStation backup",true)}};
  i.click();
}
$view.addEventListener('click',e=>{if(e.target.closest('[data-import]'))importBackup()});

/* ======================= live weather (Open-Meteo, no key needed) ======================= */
const PLACE={city:'Baghdad',lat:33.3152,lon:44.3661};
const wmo=c=>c<=1?'clear':c===2?'partly':c===3?'cloudy':c<=48?'fog':c<=67||(c>=80&&c<=82)?'rain':c<=77||c===85||c===86?'snow':c>=95?'storm':'cloudy';
const hhmm=s=>s?s.slice(11,16):'';
async function fetchWeather(){
  try{
    const q=new URLSearchParams({latitude:PLACE.lat,longitude:PLACE.lon,timezone:'auto',forecast_days:6,
      current:'temperature_2m,relative_humidity_2m,weather_code,is_day',hourly:'temperature_2m,weather_code,is_day',
      daily:'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset'});
    const r=await fetch('https://api.open-meteo.com/v1/forecast?'+q);if(!r.ok)throw new Error(r.status);const j=await r.json(),now=new Date().toISOString();
    weather={city:PLACE.city,temp:j.current.temperature_2m,humidity:j.current.relative_humidity_2m,code:wmo(j.current.weather_code),isDay:!!j.current.is_day,updatedAt:now};
    forecast={city:PLACE.city,updatedAt:now,
      daily:j.daily.time.map((d,i)=>({date:d,code:wmo(j.daily.weather_code[i]),hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i],sunrise:hhmm(j.daily.sunrise[i]),sunset:hhmm(j.daily.sunset[i])})),
      hourly:j.hourly.time.map((t,i)=>({at:new Date(t+(j.utc_offset_seconds>=0?'+':'-')+pad(Math.abs(j.utc_offset_seconds)/3600|0)+':'+pad(Math.abs(j.utc_offset_seconds)%3600/60|0)).toISOString(),temp:j.hourly.temperature_2m[i],code:wmo(j.hourly.weather_code[i]),day:!!j.hourly.is_day[i]}))};
    store.set('ss-wx',{weather,forecast});
  }catch{const c=store.get('ss-wx',null);if(c&&!weather){weather=c.weather;forecast=c.forecast}}
  lastDial='';paintWeather();
}
fetchWeather();setInterval(fetchWeather,20*6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!weather||Date.now()-new Date(weather.updatedAt)>15*6e4))fetchWeather()});
</script>
